<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">IT System Business Benefits</title>
  <desc id="desc">A presentation diagram showing how IT System turns scattered IT work into business-ready information.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3b8c"/>
      <stop offset="55%" stop-color="#1167b1"/>
      <stop offset="100%" stop-color="#16a3a3"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f1ff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8fff6"/>
      <stop offset="100%" stop-color="#f7fffb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L16,9 L2,16 Z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 800 54px "Segoe UI", Tahoma, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .subtitle { font: 500 28px "Segoe UI", Tahoma, sans-serif; fill: rgba(255,255,255,.86); letter-spacing: 0; }
      .section-title { font: 800 34px "Segoe UI", Tahoma, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .card-title { font: 800 27px "Segoe UI", Tahoma, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .body { font: 500 24px "Segoe UI", Tahoma, sans-serif; fill: #334155; letter-spacing: 0; }
      .body-strong { font: 800 24px "Segoe UI", Tahoma, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .small { font: 500 20px "Segoe UI", Tahoma, sans-serif; fill: #475569; letter-spacing: 0; }
      .dark-title { font: 800 24px "Segoe UI", Tahoma, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .dark-small { font: 500 20px "Segoe UI", Tahoma, sans-serif; fill: #cbd5e1; letter-spacing: 0; }
      .pill { font: 800 20px "Segoe UI", Tahoma, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .metric { font: 900 36px "Segoe UI", Tahoma, sans-serif; fill: #0f3b8c; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #dbe4f0; stroke-width: 2; rx: 24; filter: url(#shadow); }
      .mini-card { fill: #ffffff; stroke: #dbe4f0; stroke-width: 2; rx: 18; }
      .muted-line { stroke: #dbe4f0; stroke-width: 2; }
      .arrow { stroke: #2563eb; stroke-width: 6; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="1080"/>
  <rect x="0" y="0" width="1920" height="190" fill="url(#hero)"/>
  <circle cx="1660" cy="20" r="240" fill="#ffffff" opacity="0.08"/>
  <circle cx="145" cy="168" r="170" fill="#ffffff" opacity="0.08"/>

  <text class="title" x="100" y="82">IT System: เปลี่ยนงาน IT ให้บริหารได้ด้วยข้อมูล</text>
  <text class="subtitle" x="104" y="132">จาก Excel / Chat / การตามงานด้วยมือ สู่ Dashboard, Ticket, Inventory และ Report ในที่เดียว</text>

  <g transform="translate(94 238)">
    <rect class="card" x="0" y="0" width="500" height="520"/>
    <rect x="0" y="0" width="500" height="82" rx="24" fill="#fee2e2"/>
    <text class="section-title" x="34" y="54">ก่อนมีระบบ</text>
    <text class="body" x="34" y="126">งาน IT กระจายหลายช่องทาง</text>
    <line class="muted-line" x1="34" y1="154" x2="466" y2="154"/>

    <g transform="translate(34 190)">
      <circle cx="28" cy="28" r="28" fill="#fee2e2"/>
      <text x="28" y="38" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="30" font-weight="900" fill="#b91c1c">!</text>
      <text class="body-strong" x="78" y="24">แจ้งซ่อมผ่านแชทหรือปากเปล่า</text>
      <text class="small" x="78" y="56">ไม่มีหลักฐานกลางและตามย้อนหลังยาก</text>
    </g>

    <g transform="translate(34 285)">
      <circle cx="28" cy="28" r="28" fill="#ffedd5"/>
      <text x="28" y="38" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="28" font-weight="900" fill="#c2410c">X</text>
      <text class="body-strong" x="78" y="24">ข้อมูลเครื่องอยู่ในหลายไฟล์</text>
      <text class="small" x="78" y="56">ค้นหาเครื่อง ผู้ใช้ และประวัติซ่อมใช้เวลา</text>
    </g>

    <g transform="translate(34 380)">
      <circle cx="28" cy="28" r="28" fill="#fef9c3"/>
      <text x="28" y="38" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="28" font-weight="900" fill="#a16207">?</text>
      <text class="body-strong" x="78" y="24">รายงานต้องรวบรวมด้วยมือ</text>
      <text class="small" x="78" y="56">ผู้บริหารเห็นภาพรวมช้าและไม่ครบ</text>
    </g>
  </g>

  <path class="arrow" d="M635 498 C700 498, 720 498, 780 498"/>

  <g transform="translate(810 238)">
    <rect class="card" x="0" y="0" width="420" height="520"/>
    <rect x="0" y="0" width="420" height="82" rx="24" fill="url(#softBlue)"/>
    <text class="section-title" x="34" y="54">IT System</text>
    <text class="body" x="34" y="126">ศูนย์กลางงาน IT ภายในองค์กร</text>
    <line class="muted-line" x1="34" y1="154" x2="386" y2="154"/>

    <g transform="translate(40 198)">
      <rect class="mini-card" x="0" y="0" width="340" height="64" rx="16" fill="#eff6ff"/>
      <text class="card-title" x="26" y="42">Inventory</text>
      <text class="small" x="185" y="42">รู้ว่าเครื่องไหนอยู่กับใคร</text>
    </g>

    <g transform="translate(40 284)">
      <rect class="mini-card" x="0" y="0" width="340" height="64" rx="16" fill="#f0fdfa"/>
      <text class="card-title" x="26" y="42">Ticket</text>
      <text class="small" x="185" y="42">เปิดงานและตามสถานะได้</text>
    </g>

    <g transform="translate(40 370)">
      <rect class="mini-card" x="0" y="0" width="340" height="64" rx="16" fill="#f8fafc"/>
      <text class="card-title" x="26" y="42">Report</text>
      <text class="small" x="185" y="42">สรุปข้อมูลเพื่อประชุม</text>
    </g>
  </g>

  <path class="arrow" d="M1268 498 C1334 498, 1354 498, 1414 498"/>

  <g transform="translate(1444 238)">
    <rect class="card" x="0" y="0" width="382" height="520"/>
    <rect x="0" y="0" width="382" height="82" rx="24" fill="url(#softGreen)"/>
    <text class="section-title" x="34" y="54">ผลลัพธ์ที่ธุรกิจได้</text>
    <text class="body" x="34" y="126">เห็นงานจริง วัดผลได้ ตัดสินใจเร็วขึ้น</text>
    <line class="muted-line" x1="34" y1="154" x2="348" y2="154"/>

    <g transform="translate(34 190)">
      <text class="metric" x="0" y="36">01</text>
      <text class="body-strong" x="76" y="26">ลดงานตกหล่น</text>
      <text class="small" x="76" y="58">ทุกคำขอมี ticket และสถานะ</text>
    </g>

    <g transform="translate(34 285)">
      <text class="metric" x="0" y="36">02</text>
      <text class="body-strong" x="76" y="26">ลดเวลาค้นหา</text>
      <text class="small" x="76" y="58">เครื่อง ผู้ใช้ ประวัติซ่อมอยู่รวมกัน</text>
    </g>

    <g transform="translate(34 380)">
      <text class="metric" x="0" y="36">03</text>
      <text class="body-strong" x="76" y="26">วางแผนจากข้อมูลจริง</text>
      <text class="small" x="76" y="58">เห็นงาน critical และปัญหาซ้ำ</text>
    </g>
  </g>

  <g transform="translate(94 825)">
    <rect x="0" y="0" width="1732" height="170" rx="28" fill="#0f172a"/>
    <text class="section-title" x="34" y="52" fill="#ffffff">ตัวอย่างเคสเดโมที่ผู้บริหารเห็นภาพเร็ว</text>

    <g transform="translate(34 78)">
      <rect x="0" y="0" width="520" height="64" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="18" y="18" width="108" height="28" rx="14" fill="#dc2626"/>
      <text class="pill" x="72" y="39" text-anchor="middle">Critical</text>
      <text class="dark-title" x="150" y="27">Somsak - Domain Login ช้า</text>
      <text class="dark-small" x="150" y="54">กระทบการเริ่มงานของหลายฝ่าย</text>
    </g>

    <g transform="translate(604 78)">
      <rect x="0" y="0" width="520" height="64" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="18" y="18" width="86" height="28" rx="14" fill="#ea580c"/>
      <text class="pill" x="61" y="39" text-anchor="middle">High</text>
      <text class="dark-title" x="128" y="27">Chollada - Excel รายงานบัญชีช้า</text>
      <text class="dark-small" x="128" y="54">กระทบงานปิดงบและเอกสารการเงิน</text>
    </g>

    <g transform="translate(1174 78)">
      <rect x="0" y="0" width="520" height="64" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="18" y="18" width="86" height="28" rx="14" fill="#ea580c"/>
      <text class="pill" x="61" y="39" text-anchor="middle">High</text>
      <text class="dark-title" x="128" y="27">Chakrit - Remote Support ไม่เสถียร</text>
      <text class="dark-small" x="128" y="54">กระทบความเร็วในการช่วยเหลือผู้ใช้</text>
    </g>
  </g>
</svg>
